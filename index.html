<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jerald David Cane - Portfolio</title>
  <meta
    name="description"
    content="Personal portfolio — about, experience, stack, and contact."
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --bg: #FAFAF9;
      --bg-panel: #F1F0EE;
      --ink: #121214;
      --ink-soft: #5B5B60;
      --ink-faint: #9C9C9F;
      --line: #E2E1DD;
      --accent: #0891B2;
      --accent-ink: #FFFFFF;
      --accent-soft: #E0F7FA;
      --accent-rgb: 8, 145, 178;
      --shadow: 0 12px 30px -14px rgba(18, 18, 20, 0.16);

      --font-display: 'Space Grotesk', sans-serif;
      --font-body: 'Inter', sans-serif;
      --font-mono: 'IBM Plex Mono', monospace;

      --rail-w: 84px;
      --content-max: 720px;
      --edge-pad: 48px;
      --frame-max: 1366px;
      --frame-offset: max(0px, calc((100vw - var(--frame-max)) / 2));

      color-scheme: light;
    }

    html[data-theme="dark"] {
      --bg: #0A0A0C;
      --bg-panel: #151519;
      --ink: #F3F3F4;
      --ink-soft: #A6A6AC;
      --ink-faint: #6B6B72;
      --line: #232327;
      --accent: #22D3EE;
      --accent-ink: #0A0A0C;
      --accent-soft: rgba(34, 211, 238, 0.14);
      --accent-rgb: 34, 211, 238;
      --shadow: 0 12px 30px -14px rgba(0, 0, 0, 0.5);

      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-body);
      font-size: 17px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      transition:
        background 0.35s ease,
        color 0.35s ease;
      position: relative;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    ul {
      list-style: none;
    }

    img {
      max-width: 100%;
      display: block;
    }

    ::selection {
      background: var(--accent);
      color: var(--accent-ink);
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
      border-radius: 2px;
    }

    h1,
    h2,
    h3 {
      font-family: var(--font-display);
      letter-spacing: -0.01em;
    }

    .bg-layer {
      position: fixed;
      top: 0;
      bottom: 0;
      left: var(--frame-offset);
      right: var(--frame-offset);
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .bg-grid {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(
        var(--line) 1px,
        transparent 1px
      );
      background-size: 34px 34px;
      opacity: 0.55;
      mask-image: radial-gradient(
        ellipse 80% 60% at 50% 0%,
        black 40%,
        transparent 100%
      );
      -webkit-mask-image: radial-gradient(
        ellipse 80% 60% at 50% 0%,
        black 40%,
        transparent 100%
      );
    }

    .cursor-glow {
      position: fixed;
      top: 0;
      bottom: 0;
      left: var(--frame-offset);
      right: var(--frame-offset);
      pointer-events: none;
      z-index: 2;
      background: radial-gradient(
        420px circle at var(--mx, 50%) var(--my, 20%),
        rgba(var(--accent-rgb), 0.14),
        transparent 70%
      );
      opacity: 0;
      transition: opacity 0.4s;
    }

    html[data-theme="dark"] .cursor-glow.is-active {
      opacity: 1;
    }

    .page-frame {
      max-width: var(--frame-max);
      margin: 0 auto;
      position: relative;
      min-height: 100vh;
      background: var(--bg);
      transition: background 0.35s ease;
    }

    #progress {
      position: fixed;
      top: 0;
      left: var(--frame-offset);
      width: 3px;
      height: 0%;
      background: var(--accent);
      z-index: 60;
      transition:
        height 0.08s linear,
        background 0.35s ease;
    }

    .rail {
      position: fixed;
      left: var(--frame-offset);
      top: 0;
      bottom: 0;
      width: var(--rail-w);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 28px 0 24px;
      border-right: 1px solid var(--line);
      background: var(--bg);
      z-index: 50;
      transition:
        background 0.35s ease,
        border-color 0.35s ease;
    }

    .rail-nav {
      display: flex;
      flex-direction: column;
      gap: 22px;
      align-items: center;
    }

    .rail-dot {
      position: relative;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--line);
      border: none;
      cursor: pointer;
      padding: 0;
      transition:
        background 0.2s,
        transform 0.2s;
    }

    .rail-dot::after {
      content: attr(data-label);
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.02em;
      color: var(--ink-soft);
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s;
    }

    .rail-dot:hover::after,
    .rail-dot:focus-visible::after {
      opacity: 1;
    }

    .rail-dot.active {
      background: var(--accent);
      transform: scale(1.3);
    }

    .rail-foot {
      display: flex;
      flex-direction: column;
      gap: 18px;
      align-items: center;
    }

    .theme-toggle {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: var(--bg-panel);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--ink);
      transition:
        border-color 0.2s,
        transform 0.2s,
        background 0.35s ease;
    }

    .theme-toggle:hover {
      border-color: var(--accent);
      transform: rotate(14deg);
    }

    .theme-toggle svg {
      width: 16px;
      height: 16px;
    }

    .theme-toggle .icon-sun {
      display: none;
    }

    html[data-theme="dark"] .theme-toggle .icon-moon {
      display: none;
    }

    html[data-theme="dark"] .theme-toggle .icon-sun {
      display: block;
    }

    main {
      margin-left: var(--rail-w);
      position: relative;
      z-index: 1;
    }

    .section {
      padding: 96px var(--edge-pad) 96px calc(var(--edge-pad) + 12px);
      border-bottom: 1px solid var(--line);
      position: relative;
      overflow: hidden;
      transition: border-color 0.35s ease;
    }

    .section-inner {
      max-width: var(--content-max);
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: 0.08em;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    .eyebrow .num {
      color: var(--ink-faint);
    }

    .ghost-num {
      position: absolute;
      right: var(--edge-pad);
      top: 60px;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 180px;
      line-height: 1;
      color: var(--ink);
      opacity: 0.035;
      pointer-events: none;
      user-select: none;
    }

    .reveal {
      opacity: 0;
      transform: translateY(18px);
      transition:
        opacity 0.6s cubic-bezier(.16, .8, .3, 1),
        transform 0.6s cubic-bezier(.16, .8, .3, 1);
    }

    .reveal.in-view {
      opacity: 1;
      transform: translateY(0);
    }

    .hero {
      padding-top: 120px;
      padding-bottom: 100px;
    }

    .hero .section-inner {
      max-width: 960px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 56px;
      align-items: start;
    }

    .hero-photo {
      position: relative;
      width: 190px;
      height: 190px;
      border-radius: 50%;
      justify-self: end;
      flex-shrink: 0;
      margin-top: 6px;
    }

    .hero-photo::after {
      content: '';
      position: absolute;
      inset: -14px;
      border-radius: 50%;
      border: 1px dashed var(--line);
      animation: spin-slow 40s linear infinite;
    }

    @keyframes spin-slow {
      to {
        transform: rotate(360deg);
      }
    }

    .hero-photo-frame {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      border: 1px solid var(--line);
      background: var(--bg-panel);
      box-shadow: var(--shadow);
      transition:
        transform 0.3s ease,
        border-color 0.3s ease;
    }

    .hero-photo:hover .hero-photo-frame {
      transform: scale(1.03);
      border-color: var(--accent);
    }

    .hero-photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .hero-photo-fallback {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(
        135deg,
        var(--bg-panel),
        var(--accent-soft)
      );
    }

    .hero-photo-fallback span {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 56px;
      letter-spacing: -0.02em;
      background: linear-gradient(
        135deg,
        var(--ink),
        var(--accent)
      );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--ink-soft);
      border: 1px solid var(--line);
      padding: 6px 12px;
      border-radius: 100px;
      margin-bottom: 28px;
      background: var(--bg-panel);
    }

    .hero-badge .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .hero-badge .dot.status-active {
      background: #2FBF64;
      box-shadow: 0 0 0 3px rgba(47, 191, 100, 0.18);
      animation: pulse-green 2.2s ease-in-out infinite;
    }

    .hero-badge .dot.status-inactive {
      background: #FACC15;
      box-shadow: 0 0 0 3px rgba(250, 204, 21, 0.18);
      animation: pulse-yellow 2.2s ease-in-out infinite;
    }

    @keyframes pulse-green {
      0%,
      100% {
        box-shadow: 0 0 0 3px rgba(47, 191, 100, 0.18);
      }

      50% {
        box-shadow: 0 0 0 6px rgba(47, 191, 100, 0.10);
      }
    }

    @keyframes pulse-yellow {
      0%,
      100% {
        box-shadow: 0 0 0 3px rgba(250, 204, 21, 0.18);
      }

      50% {
        box-shadow: 0 0 0 6px rgba(250, 204, 21, 0.10);
      }
    }

    .hero h1 {
      font-size: clamp(38px, 6vw, 64px);
      font-weight: 600;
      line-height: 1.05;
      margin-bottom: 22px;
    }

    .hero .role {
      font-family: var(--font-mono);
      font-size: 15px;
      color: var(--accent);
      margin-bottom: 22px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .hero .role-separator {
      color: var(--ink-faint);
    }

    .hero .role-cv {
      color: var(--ink-soft);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color 0.15s ease;
    }

    .hero .role-cv:hover {
      color: var(--accent);
    }

    .hero .role-cv .cv-arrow {
      font-size: 12px;
      opacity: 0.5;
      transform: translate(0, 0);
      transition:
        opacity 0.15s ease,
        transform 0.15s ease;
    }

    .hero .role-cv:hover .cv-arrow {
      opacity: 1;
      transform: translate(2px, -2px);
    }

    .hero p.tagline {
      max-width: 560px;
      font-size: 18px;
      color: var(--ink-soft);
      margin-bottom: 36px;
    }

    .hero-actions {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    .btn {
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 600;
      padding: 13px 22px;
      border-radius: 8px;
      border: 1px solid var(--ink);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition:
        background 0.15s,
        color 0.15s,
        transform 0.15s,
        box-shadow 0.15s,
        border-color 0.2s;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--ink);
      color: var(--bg);
    }

    .btn-primary:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink);
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }

    .btn-ghost {
      background: transparent;
      color: var(--ink);
    }

    .btn-ghost:hover {
      background: var(--bg-panel);
      transform: translateY(-2px);
    }

    .about-grid {
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 56px;
    }

    .about-grid p {
      color: var(--ink-soft);
      margin-bottom: 16px;
      font-size: 16.5px;
    }

    .about-grid p:last-of-type {
      margin-bottom: 0;
    }

    .fact-list {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .fact {
      border-top: 1px solid var(--line);
      padding-top: 12px;
      transition: border-color 0.35s ease;
    }

    .fact dt {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.06em;
      color: var(--ink-faint);
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .fact dd {
      font-size: 15px;
      font-weight: 500;
    }

    .timeline {
      display: flex;
      flex-direction: column;
    }

    .job {
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 28px;
      padding: 28px 0;
      border-top: 1px solid var(--line);
      position: relative;
      transition:
        border-color 0.35s ease,
        transform 0.25s ease;
    }

    .job:first-child {
      border-top: none;
    }

    .job:hover {
      transform: translateX(4px);
    }

    .job-period {
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--ink-faint);
      padding-top: 3px;
    }

    .job-role {
      font-size: 19px;
      font-weight: 600;
      margin-bottom: 3px;
    }

    .job-company {
      font-size: 14px;
      color: var(--accent);
      margin-bottom: 12px;
      font-weight: 500;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px;
    }

    .job-company-link {
      color: inherit;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: color 0.15s ease;
    }

    .job-company-link:hover {
      color: var(--ink);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .company-arrow {
      font-size: 11px;
      opacity: 0.5;
      text-decoration: none;
      transform: translate(0, 0);
      transition:
        opacity 0.15s ease,
        transform 0.15s ease;
    }

    .job-company-link:hover .company-arrow {
      opacity: 1;
      transform: translate(2px, -2px);
    }

    .job-points {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .job-points li {
      font-size: 15px;
      color: var(--ink-soft);
      padding-left: 16px;
      position: relative;
    }

    .job-points li::before {
      content: '';
      position: absolute;
      left: 0;
      top: 9px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--ink-faint);
    }

    .stack-grid {
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    .stack-cat-label {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--ink-faint);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 12px;
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }

    .tag {
      font-family: var(--font-mono);
      font-size: 13px;
      border: 1px solid var(--line);
      padding: 7px 13px;
      border-radius: 7px;
      color: var(--ink);
      transition:
        border-color 0.15s,
        color 0.15s,
        background 0.15s,
        transform 0.15s;
      background: var(--bg);
    }

    .tag:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-soft);
      transform: translateY(-2px);
    }

    .contact-main a.email {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: clamp(26px, 4vw, 40px);
      display: inline-block;
      border-bottom: 2px solid var(--accent);
      padding-bottom: 4px;
      margin-bottom: 36px;
      word-break: break-all;
      transition:
        color 0.15s,
        letter-spacing 0.25s;
    }

    .contact-main a.email:hover {
      color: var(--accent);
      letter-spacing: 0.01em;
    }

    .link-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 30px;
    }

    .link-row a {
      font-family: var(--font-mono);
      font-size: 14px;
      color: var(--ink-soft);
      display: flex;
      align-items: center;
      gap: 6px;
      transition:
        color 0.15s,
        transform 0.15s;
    }

    .link-row a:hover {
      color: var(--accent);
      transform: translateY(-2px);
    }

    .link-row a::after {
      content: '↗';
      font-size: 12px;
      opacity: 0.5;
      transition:
        opacity 0.15s,
        transform 0.15s;
    }

    .link-row a:hover::after {
      opacity: 1;
      transform: translate(2px, -2px);
    }

    footer {
      padding: 32px var(--edge-pad) 40px calc(var(--edge-pad) + 12px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--ink-faint);
      flex-wrap: wrap;
      gap: 12px;
      position: relative;
      z-index: 1;
    }

    footer .back-top {
      cursor: pointer;
      transition: color 0.15s;
    }

    footer .back-top:hover {
      color: var(--accent);
    }

    @media (max-width: 860px) {
      :root {
        --edge-pad: 24px;
        --rail-w: 0px;
      }

      .rail {
        flex-direction: row;
        width: 100%;
        height: 56px;
        top: 0;
        bottom: auto;
        border-right: none;
        border-bottom: 1px solid var(--line);
        padding: 0 18px;
        justify-content: center;
      }

      .rail-nav {
        flex-direction: row;
        gap: 16px;
      }

      .rail-dot::after {
        display: none;
      }

      .rail-foot {
        position: absolute;
        right: 18px;
        flex-direction: row;
        align-items: center;
      }

      main {
        margin-left: 0;
        margin-top: 56px;
      }

      #progress {
        top: 56px;
        left: 0;
        width: 100%;
        height: 3px !important;
      }

      .about-grid {
        grid-template-columns: 1fr;
      }

      .job {
        grid-template-columns: 1fr;
        gap: 6px;
      }

      .job:hover {
        transform: none;
      }

      .ghost-num {
        font-size: 110px;
        top: 28px;
      }

      .section {
        padding: 64px 24px;
      }

      .hero {
        padding-top: 56px;
      }

      .hero-grid {
        grid-template-columns: 1fr;
        gap: 28px;
      }

      .hero-photo {
        justify-self: start;
        width: 110px;
        height: 110px;
        order: -1;
      }

      .hero-photo::after {
        display: none;
      }

      .hero-photo-fallback span {
        font-size: 34px;
      }

      .hero .role {
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>
  <div class="page-frame">
    <div class="bg-layer" aria-hidden="true">
      <div class="bg-grid"></div>
    </div>

    <div class="cursor-glow" id="cursor-glow"></div>

    <div id="progress"></div>

    <nav class="rail" aria-label="Section navigation">
      <div class="rail-nav" id="rail-nav"></div>

      <div class="rail-foot">
        <button
          class="theme-toggle"
          id="theme-toggle"
          aria-label="Toggle dark mode"
          aria-pressed="false"
        >
          <svg
            class="icon-moon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>

          <svg
            class="icon-sun"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
          </svg>
        </button>
      </div>
    </nav>

    <main>
      <section class="section hero" id="top">
        <div class="section-inner reveal in-view">
          <div class="hero-grid">
            <div>
              <div
                class="hero-badge"
                id="availability-badge"
              ></div>

              <h1 id="hero-heading"></h1>

              <div
                class="role"
                id="hero-role"
              ></div>

              <p
                class="tagline"
                id="hero-tagline"
              ></p>

              <div class="hero-actions">
                <a
                  href="#contact"
                  class="btn btn-primary"
                >
                  Get in touch
                </a>

                <a
                  href="#experience"
                  class="btn btn-ghost"
                >
                  See experience
                </a>
              </div>
            </div>

            <div
              class="hero-photo"
              id="hero-photo"
            ></div>
          </div>
        </div>
      </section>

      <section
        class="section"
        id="about"
      >
        <div class="ghost-num">01</div>

        <div class="section-inner">
          <div class="eyebrow reveal">
            <span class="num">01</span> — About
          </div>

          <div class="about-grid">
            <div
              id="about-copy"
              class="reveal"
            ></div>

            <dl
              class="fact-list reveal"
              id="about-facts"
            ></dl>
          </div>
        </div>
      </section>

      <section
        class="section"
        id="experience"
      >
        <div class="ghost-num">02</div>

        <div class="section-inner">
          <div class="eyebrow reveal">
            <span class="num">02</span> — Experience
          </div>

          <div
            class="timeline"
            id="experience-list"
          ></div>
        </div>
      </section>

      <section
        class="section"
        id="stack"
      >
        <div class="ghost-num">03</div>

        <div class="section-inner">
          <div class="eyebrow reveal">
            <span class="num">03</span> — Stack
          </div>

          <div
            class="stack-grid"
            id="stack-list"
          ></div>
        </div>
      </section>

      <section
        class="section"
        id="contact"
        style="border-bottom: none;"
      >
        <div class="ghost-num">04</div>

        <div class="section-inner contact-main">
          <div class="eyebrow reveal">
            <span class="num">04</span> — Contact
          </div>

          <a
            class="email reveal"
            id="contact-email"
            href="#"
          ></a>

          <div
            class="link-row reveal"
            id="contact-links"
          ></div>
        </div>
      </section>

      <footer>
        <span id="footer-note"></span>

        <span
          class="back-top"
          id="back-top"
        >
          Back to top ↑
        </span>
      </footer>
    </main>
  </div>

  <script>
    const CONFIG = {
      name: "Jerald David Cane",
      role: "Web Developer",

      tagline:
        "With one year of experience in full-stack development, specializing in designing, developing, and implementing modular web applications and software solutions. Collaborated with cross-functional teams, translating client requirements into functional modules, and delivering scalable, efficient, and maintainable applications",

      availability: {
        status: "active"
      },

      photo: {
        url: "./images/profile.jpg",
        alt: "Profile Picture"
      },

      heroHeading: {
        line1: "Jerald David Cane",
        line2: ""
      },

      about: {
        paragraphs: [
          "I work across the stack, but I lean into the structural side of things such as designing the modules, API contracts, and database relationships that let a system grow without breaking.",
          "Recent work includes reporting and operations tooling built for teams that need reliability first, clear module boundaries, responsive component-based UIs, and enough documentation and demoing that stakeholders trust what's shipped."
        ],

        facts: [
          {
            label: "Based in",
            value: "Malabon City, Philippines"
          },
          {
            label: "Focus",
            value: "Full Stack"
          },
          {
            label: "Currently",
            value: "Web Developer (Junior Developer I)"
          }
        ]
      },

      experience: [
        {
          role: "Web Developer",

          company: {
            name: "ELITE Software and Data Security Inc.",
            details: "Manila, Philippines · Full-time · Hybrid",
            url: "https://www.linkedin.com/company/99711045/"
          },

          period: "June 2025 — Present",

          points: [
            "Developed and maintained a modular web-based system for managing accident and incident reports and shipping management operations, building scalable modules with Laravel and RESTful API integration.",
            "Built responsive, component-based user interfaces with Vue.js and Tailwind CSS to improve usability and overall user experience.",
            "Presented system modules directly to clients, demonstrating functionality, implementation, and alignment with business requirements."
          ]
        },

        {
          role: "PHP Developer (Internship)",

          company: {
            name: "Go8 Technology Inc.",
            details: "Parañaque, Philippines · Internship · On-site",
            url: "https://www.linkedin.com/company/106451404/"
          },

          period: "March 2024 – May 2024",

          points: [
            "Designed and implemented Eloquent ORM database relationships in Laravel.",
            "Applied object-oriented programming (OOP) principles to maintain and develop web applications.",
            "Gained hands-on experience with Laravel, Git, MySQL, and JavaScript.",
            "Designed and developed responsive web applications using Bootstrap."
          ]
        }
      ],

      stack: [
        {
          category: "Frontend & UI",
          items: [
            "JavaScript",
            "Vue.js",
            "Tailwind CSS",
            "Bootstrap"
          ]
        },

        {
          category: "Backend Development",
          items: [
            "PHP",
            "Laravel",
            "MySQL",
            "MariaDB",
            "RESTful API"
          ]
        },

        {
          category: "Tools & Platforms",
          items: [
            "Git",
            "Docker",
            "Ubuntu WSL",
            "VSCode",
            "PHPStorm",
            "DBeaver",
            "Postman",
            "Hoppscotch",
            "WinSCP",
            "Jira",
            "ClickUp",
            "Canva"
          ]
        }
      ],

      contact: {
        email: "cane.jeralddavidj@gmail.com",

        cv: {
          label: "Curriculum Vitae",
          url: "https://drive.google.com/file/d/1LoQux0az_thcZm4sx9ORawGZr60dvKFl/view?usp=sharing"
        },

        links: [
          {
            label: "GitHub",
            url: "https://github.com/dlarejenac"
          },
          {
            label: "LinkedIn",
            url: "https://www.linkedin.com/in/jerald-david-cane/"
          },
          {
            label: "Curriculum Vitae",
            url: "https://drive.google.com/file/d/1LoQux0az_thcZm4sx9ORawGZr60dvKFl/view?usp=sharing"
          }
        ]
      },

      footerNote:
        "Built by Jerald David Cane · " +
        new Date().getFullYear()
    };

    (function render() {
      const $ = (
        selector,
        context = document
      ) => context.querySelector(selector);

      const create = (
        tag,
        cls,
        html
      ) => {
        const element = document.createElement(tag);

        if (cls) {
          element.className = cls;
        }

        if (html !== undefined) {
          element.innerHTML = html;
        }

        return element;
      };

      const esc = (str) =>
        String(str).replace(
          /[&<>"']/g,
          (char) => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
          }[char])
        );

      const sections = [
        {
          id: "about",
          label: "01 About"
        },
        {
          id: "experience",
          label: "02 Experience"
        },
        {
          id: "stack",
          label: "03 Stack"
        },
        {
          id: "contact",
          label: "04 Contact"
        }
      ];

      const railNav = $("#rail-nav");

      sections.forEach((section) => {
        const button = create(
          "button",
          "rail-dot"
        );

        button.setAttribute(
          "data-label",
          section.label
        );

        button.setAttribute(
          "aria-label",
          "Go to " + section.label
        );

        button.dataset.target = section.id;

        button.addEventListener(
          "click",
          () => {
            document
              .getElementById(section.id)
              .scrollIntoView({
                behavior: "smooth"
              });
          }
        );

        railNav.appendChild(button);
      });

      if (CONFIG.availability) {
        const badge = $("#availability-badge");

        const status =
          CONFIG.availability.status;

        const statusText = {
          active: "Available for new projects",
          inactive: "Unavailable for new projects"
        };

        const dot = create(
          "span",
          "dot status-" + status
        );

        badge.appendChild(dot);

        badge.appendChild(
          document.createTextNode(
            statusText[status] ||
            "Status unavailable"
          )
        );
      } else {
        $("#availability-badge").style.display =
          "none";
      }

      const heading = $("#hero-heading");

      heading.innerHTML =
        esc(CONFIG.heroHeading.line1) +
        (
          CONFIG.heroHeading.line2
            ? "<br>" +
              esc(CONFIG.heroHeading.line2)
            : ""
        );

      const role = $("#hero-role");

      const roleText = create(
        "span",
        null,
        esc(CONFIG.role)
      );

      role.appendChild(roleText);

      if (CONFIG.contact.cv?.url) {
        role.appendChild(
          create(
            "span",
            "role-separator",
            "·"
          )
        );

        const cvLink = create(
          "a",
          "role-cv"
        );

        cvLink.href = CONFIG.contact.cv.url;
        cvLink.target = "_blank";
        cvLink.rel = "noopener noreferrer";

        const cvLabel = create(
          "span",
          null,
          esc(CONFIG.contact.cv.label)
        );

        const cvArrow = create(
          "span",
          "cv-arrow",
          "↗"
        );

        cvArrow.setAttribute(
          "aria-hidden",
          "true"
        );

        cvLink.appendChild(cvLabel);
        cvLink.appendChild(cvArrow);

        role.appendChild(cvLink);
      }

      $("#hero-tagline").textContent =
        CONFIG.tagline;

      const photoSlot = $("#hero-photo");

      if (
        CONFIG.photo &&
        CONFIG.photo.url
      ) {
        const frame = create(
          "div",
          "hero-photo-frame"
        );

        const image = create("img");

        image.src = CONFIG.photo.url;
        image.alt =
          CONFIG.photo.alt ||
          CONFIG.name;
        image.loading = "eager";

        frame.appendChild(image);
        photoSlot.appendChild(frame);
      } else {
        const frame = create(
          "div",
          "hero-photo-frame"
        );

        const fallback = create(
          "div",
          "hero-photo-fallback"
        );

        fallback.appendChild(
          create(
            "span",
            null,
            "JC"
          )
        );

        frame.appendChild(fallback);
        photoSlot.appendChild(frame);
      }

      const aboutCopy = $("#about-copy");

      CONFIG.about.paragraphs.forEach(
        (paragraph) => {
          aboutCopy.appendChild(
            create(
              "p",
              null,
              esc(paragraph)
            )
          );
        }
      );

      const aboutFacts = $("#about-facts");

      CONFIG.about.facts.forEach(
        (fact) => {
          const wrapper = create(
            "div",
            "fact"
          );

          wrapper.appendChild(
            create(
              "dt",
              null,
              esc(fact.label)
            )
          );

          wrapper.appendChild(
            create(
              "dd",
              null,
              esc(fact.value)
            )
          );

          aboutFacts.appendChild(wrapper);
        }
      );

      const experienceList =
        $("#experience-list");

      CONFIG.experience.forEach(
        (job) => {
          const row = create(
            "div",
            "job reveal"
          );

          const period = create(
            "div",
            "job-period",
            esc(job.period)
          );

          const body = create("div");

          body.appendChild(
            create(
              "div",
              "job-role",
              esc(job.role)
            )
          );

          const company = create(
            "div",
            "job-company"
          );

          if (
            job.company &&
            job.company.url
          ) {
            const companyLink = create(
              "a",
              "job-company-link"
            );

            companyLink.href =
              job.company.url;

            companyLink.target =
              "_blank";

            companyLink.rel =
              "noopener noreferrer";

            const companyName = create(
              "span",
              null,
              esc(job.company.name)
            );

            const companyArrow = create(
              "span",
              "company-arrow",
              "↗"
            );

            companyArrow.setAttribute(
              "aria-hidden",
              "true"
            );

            companyLink.appendChild(
              companyName
            );

            companyLink.appendChild(
              companyArrow
            );

            company.appendChild(
              companyLink
            );

            company.appendChild(
              document.createTextNode(
                " · " +
                job.company.details
              )
            );
          } else {
            company.textContent =
              job.company;
          }

          body.appendChild(company);

          const points = create(
            "ul",
            "job-points"
          );

          job.points.forEach(
            (point) => {
              points.appendChild(
                create(
                  "li",
                  null,
                  esc(point)
                )
              );
            }
          );

          body.appendChild(points);

          row.appendChild(period);
          row.appendChild(body);

          experienceList.appendChild(row);
        }
      );

      const stackList = $("#stack-list");

      CONFIG.stack.forEach(
        (group) => {
          const wrapper = create(
            "div",
            "reveal"
          );

          wrapper.appendChild(
            create(
              "div",
              "stack-cat-label",
              esc(group.category)
            )
          );

          const tagRow = create(
            "div",
            "tag-row"
          );

          group.items.forEach(
            (item) => {
              tagRow.appendChild(
                create(
                  "span",
                  "tag",
                  esc(item)
                )
              );
            }
          );

          wrapper.appendChild(tagRow);
          stackList.appendChild(wrapper);
        }
      );

      const emailElement =
        $("#contact-email");

      emailElement.textContent =
        CONFIG.contact.email;

      emailElement.href =
        "mailto:" +
        CONFIG.contact.email;

      const linkRow =
        $("#contact-links");

      CONFIG.contact.links.forEach(
        (link) => {
          const anchor = create(
            "a",
            null,
            esc(link.label)
          );

          anchor.href = link.url;
          anchor.target = "_blank";
          anchor.rel =
            "noopener noreferrer";

          linkRow.appendChild(anchor);
        }
      );

      $("#footer-note").textContent =
        CONFIG.footerNote;

      document.title =
        CONFIG.name +
        " — Portfolio";

      const root =
        document.documentElement;

      const toggleButton =
        $("#theme-toggle");

      let theme =
        window.matchMedia(
          "(prefers-color-scheme: dark)"
        ).matches
          ? "dark"
          : "light";

      function applyTheme(
        selectedTheme
      ) {
        theme = selectedTheme;

        root.setAttribute(
          "data-theme",
          selectedTheme
        );

        toggleButton.setAttribute(
          "aria-pressed",
          String(
            selectedTheme === "dark"
          )
        );
      }

      applyTheme(theme);

      toggleButton.addEventListener(
        "click",
        () => {
          applyTheme(
            theme === "dark"
              ? "light"
              : "dark"
          );
        }
      );

      if (
        window.matchMedia(
          "(pointer: fine)"
        ).matches
      ) {
        const glow =
          $("#cursor-glow");

        glow.classList.add(
          "is-active"
        );

        document.addEventListener(
          "mousemove",
          (event) => {
            const rect =
              glow.getBoundingClientRect();

            glow.style.setProperty(
              "--mx",
              event.clientX -
                rect.left +
                "px"
            );

            glow.style.setProperty(
              "--my",
              event.clientY -
                rect.top +
                "px"
            );
          }
        );
      }

      const progress = $("#progress");

      const dots = Array.from(
        document.querySelectorAll(
          ".rail-dot"
        )
      );

      const sectionElements =
        sections.map(
          (section) =>
            document.getElementById(
              section.id
            )
        );

      function onScroll() {
        const scrollTop =
          window.scrollY;

        const documentHeight =
          document.documentElement
            .scrollHeight -
          window.innerHeight;

        const percentage =
          documentHeight > 0
            ? (
                scrollTop /
                documentHeight
              ) * 100
            : 0;

        if (window.innerWidth <= 860) {
          progress.style.width =
            percentage + "%";

          progress.style.height = "";
        } else {
          progress.style.height =
            percentage + "%";

          progress.style.width = "";
        }

        let activeIndex = 0;

        const atBottom =
          Math.ceil(
            scrollTop +
            window.innerHeight
          ) >=
          document.documentElement
            .scrollHeight -
          2;

        if (atBottom) {
          activeIndex =
            sectionElements.length -
            1;
        } else {
          sectionElements.forEach(
            (element, index) => {
              if (
                element &&
                element
                  .getBoundingClientRect()
                  .top <=
                  window.innerHeight * 0.4
              ) {
                activeIndex = index;
              }
            }
          );
        }

        dots.forEach(
          (dot, index) => {
            dot.classList.toggle(
              "active",
              index === activeIndex
            );
          }
        );
      }

      document.addEventListener(
        "scroll",
        onScroll,
        {
          passive: true
        }
      );

      window.addEventListener(
        "resize",
        onScroll
      );

      onScroll();

      $("#back-top").addEventListener(
        "click",
        () => {
          window.scrollTo({
            top: 0,
            behavior: "smooth"
          });
        }
      );

      const revealElements =
        document.querySelectorAll(
          ".reveal:not(.in-view)"
        );

      const observer =
        new IntersectionObserver(
          (entries) => {
            entries.forEach(
              (entry) => {
                if (
                  entry.isIntersecting
                ) {
                  entry.target.classList.add(
                    "in-view"
                  );

                  observer.unobserve(
                    entry.target
                  );
                }
              }
            );
          },
          {
            threshold: 0.12,
            rootMargin:
              "0px 0px -40px 0px"
          }
        );

      revealElements.forEach(
        (element) =>
          observer.observe(element)
      );
    })();
  </script>
